<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-icon" aria-hidden="true">◉</div><div><h1>Comercial <span style="color:#e7d49a">|</span> Vendas de Ovos</h1><p>Painel independente de vendas e clientes</p></div></div>
  <nav class="nav" aria-label="Menu principal">
    <button type="button" data-page="inicio" class="active"><span class="nicon">▦</span> Início</button>
    <button type="button" data-page="vendas"><span class="nicon">▤</span> Vendas e notas</button>
    <button type="button" data-page="clientes"><span class="nicon">♙</span> Clientes</button>
    <button type="button" data-page="receber"><span class="nicon">◈</span> A receber</button>
    <button type="button" data-page="precos"><span class="nicon">▣</span> Tabela para clientes</button>
    <button type="button" data-page="dados"><span class="nicon">⚙</span> Dados e backup</button>
  </nav>
  <div class="sidebar-bottom">Área comercial separada da V11.<br>Dados salvos neste navegador.<br>Faça backups regularmente.</div>
</aside>
<main class="main">
  <div class="top"><div><h2 id="pageTitle">Visão geral</h2><p id="pageSubtitle">Controle suas vendas com simplicidade.</p></div><div class="top-action"><span class="chip">● Sistema comercial</span><button class="btn primary" type="button" id="quickNew">＋ Nova nota</button></div></div>
  <div id="content"></div>
</main>
</div>
<div id="modalLayer" class="modal-layer" role="dialog" aria-modal="true" aria-label="Painel de edição"></div>
<div id="toast" class="toast" role="status"></div>
<script>
(() => {
'use strict';
const KEY='comercial_ovos_distribuicao_v1'; // mantém compatibilidade com os dados da versão anterior
const TYPES=['Jumbo Branco','Extra Branco','A Branco','B Branco','Jumbo Vermelho','Extra Vermelho','A Vermelho','Caipira'];
const UNITS=['Pente (30 ovos)','Caixa (30 dúzias)'];
const methods=['Pix','Dinheiro','Cheque','Outro'];
const q=id=>document.getElementById(id);
const fmt=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const norm=n=>Math.round((Number(n)||0)*100)/100;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const dateFmt=s=>{if(!s)return '—';const p=s.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s};
const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,8);
const PENTE_PUBLICO=['Jumbo Branco','Extra Branco','Jumbo Vermelho','Extra Vermelho','Caipira'];
const DEFAULT_PRICES={
 'Jumbo Branco|Caixa (30 dúzias)':155,'Extra Branco|Caixa (30 dúzias)':138,
 'A Branco|Caixa (30 dúzias)':135,'B Branco|Caixa (30 dúzias)':120,
 'Jumbo Vermelho|Caixa (30 dúzias)':170,'Extra Vermelho|Caixa (30 dúzias)':155,
 'A Vermelho|Caixa (30 dúzias)':145,'Caipira|Caixa (30 dúzias)':250,
 'Jumbo Branco|Pente (30 ovos)':14,'Extra Branco|Pente (30 ovos)':13,
 'Jumbo Vermelho|Pente (30 ovos)':15,'Extra Vermelho|Pente (30 ovos)':14,
 'Caipira|Pente (30 ovos)':22
};
const defaultPriceInfo='Outras linhas de ovos: consulte valores e disponibilidade.';
const base=()=>({version:2,clients:[],sales:[],prices:{...DEFAULT_PRICES},priceNote:defaultPriceInfo,seq:1});
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.clients)&&Array.isArray(v.sales)){
 const x={...base(),...v};
 if(!v.prices||Object.keys(v.prices).length===0)x.prices={...DEFAULT_PRICES};
 else {x.prices={...v.prices};if(x.prices['Caipiras|Caixa (30 dúzias)']!==undefined && x.prices['Caipira|Caixa (30 dúzias)']===undefined)x.prices['Caipira|Caixa (30 dúzias)']=x.prices['Caipiras|Caixa (30 dúzias)'];if(x.prices['Caipiras|Pente (30 ovos)']!==undefined && x.prices['Caipira|Pente (30 ovos)']===undefined)x.prices['Caipira|Pente (30 ovos)']=x.prices['Caipiras|Pente (30 ovos)']};
 x.sales.forEach(a=>a.items?.forEach(i=>{if(i.product==='Caipiras')i.product='Caipira'}));
 if(!x.priceNote)x.priceNote=defaultPriceInfo;
 return x
 }}catch{}return base()}
let db=load(),page='inicio',search='',filter='todos',period='mes';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Não foi possível salvar os dados neste navegador. Faça backup e libere espaço.') }};
const clientName=s=>s?.customerId?(db.clients.find(c=>c.id===s.customerId)?.name||s.manualCustomer||'Cliente não encontrado'):(s?.manualCustomer||'Cliente avulso');
const total=s=>norm((s?.items||[]).reduce((a,i)=>a+norm(i.qty*i.price),0));
const paid=s=>norm((s?.payments||[]).reduce((a,p)=>a+Number(p.amount||0),0));
const due=s=>Math.max(0,norm(total(s)-paid(s)));
const status=s=>due(s)<.005?'paid':paid(s)>.005?'partial':'due';
const statusTag=s=>({paid:'<span class="tag paid">Pago</span>',partial:'<span class="tag partial">Parcial</span>',due:'<span class="tag due">Pendente</span>'}[status(s)]);
const clientPurchase=id=>db.sales.filter(s=>s.customerId===id);
function toast(msg){let t=q('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._to);window._to=setTimeout(()=>t.classList.remove('show'),2900)}
function button(label,action,clazz='btn small'){return `<button type="button" class="${clazz}" data-action="${action}">${label}</button>`}
function numberSale(s){return String(s.number).padStart(4,'0')}
const titles={inicio:['Visão geral','Resumo do seu atendimento comercial.'],vendas:['Vendas e notas','Histórico das vendas e comprovantes comerciais.'],clientes:['Clientes','Cadastre e acompanhe seus compradores.'],receber:['Contas a receber','Controle pagamentos parciais e pendências.'],precos:['Tabela de valores','Edite os preços e envie a tabela aos clientes.'],dados:['Dados e backup','Proteja e exporte seus registros.']};
function dateInPeriod(s){if(period==='todos')return true;const date=s.date||'';if(period==='mes')return date.startsWith(today().slice(0,7));if(period==='semana'){let d=new Date();d.setDate(d.getDate()-6);return date>=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};return true}
function render(){q('pageTitle').textContent=titles[page][0];q('pageSubtitle').textContent=titles[page][1];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));q('content').innerHTML={inicio:overview,vendas:salesPage,clientes:clientsPage,receber:receivablesPage,precos:pricesPage,dados:dataPage}[page]();}
const sumAll=arr=>arr.reduce((a,s)=>a+total(s),0);
function overview(){const rows=db.sales.filter(dateInPeriod).sort((a,b)=>b.date.localeCompare(a.date));const rcv=rows.reduce((a,s)=>a+paid(s),0);const pending=rows.reduce((a,s)=>a+due(s),0);return `<div class="hero"><div><span class="eyebrow">Atendimento comercial</span><h3>Organize suas vendas de ovos.</h3><p>Pedidos, clientes, notas de venda e recebimentos em um painel independente.</p></div><div style="display:flex;gap:9px;flex-wrap:wrap;position:relative;z-index:2"><button class="btn gold" data-action="newSale">＋ Criar nota</button><button class="btn" data-action="gotoPrices">▣ Tabela de valores</button></div></div>
<div class="toolbar"><label class="form-field" style="flex-direction:row;align-items:center">Período <select id="periodChoice"><option value="mes" ${period==='mes'?'selected':''}>Mês atual</option><option value="semana" ${period==='semana'?'selected':''}>Últimos 7 dias</option><option value="todos" ${period==='todos'?'selected':''}>Todos os períodos</option></select></label></div>
<div class="cards"><div class="kpi"><div class="label">Vendas lançadas</div><strong>${fmt(sumAll(rows))}</strong><div class="foot">${rows.length} notas no período</div></div><div class="kpi"><div class="label">Valor recebido</div><strong>${fmt(rcv)}</strong><div class="foot">Pagamentos registrados</div></div><div class="kpi"><div class="label">A receber</div><strong>${fmt(pending)}</strong><div class="foot">Saldo dessas vendas</div></div><div class="kpi"><div class="label">Clientes cadastrados</div><strong>${db.clients.length}</strong><div class="foot">Carteira comercial própria</div></div></div>
<div class="grid2"><div class="panel"><div class="panel-head"><h3>Últimas notas</h3>${button('Ver todas','gotoSales')}</div>${saleTable(rows.slice(0,6),true)}</div><div class="panel"><div class="panel-head"><h3>Acesso rápido</h3></div><div class="panel-body"><p class="helper">Crie um cliente, lance uma nota e compartilhe o comprovante por imagem ou impressão.</p><div style="display:grid;gap:9px">${button('＋ Cadastrar cliente','newClient','btn')}${button('▤ Nova nota de venda','newSale','btn primary')}${button('◈ Consultar pendências','gotoReceivables','btn')}${button('▣ Criar tabela de valores','gotoPrices','btn')}</div></div></div></div>`}
function saleTable(rows,compact=false){if(!rows.length)return '<div class="empty">Ainda não há notas neste período.<br>Use “Nova nota” para começar.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>Nº / Data</th><th>Cliente</th><th>Total</th><th>Status</th><th class="right">Ações</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>#${numberSale(s)}</b><div class="sub">${dateFmt(s.date)}</div></td><td>${E(clientName(s))}<div class="sub">${s.channel==='Atacado'?'Atacado':'Varejo'}</div></td><td><b>${fmt(total(s))}</b><div class="sub">Saldo: ${fmt(due(s))}</div></td><td>${statusTag(s)}</td><td><div class="actions">${button('Nota',`note:${s.id}`)}${!compact?button('Editar',`editSale:${s.id}`):''}${due(s)>.005?button('Receber',`pay:${s.id}`):''}${!compact?button('Excluir',`deleteSale:${s.id}`,'btn danger small'):''}</div></td></tr>`).join('')}</tbody></table></div>`}
function salesPage(){const rows=db.sales.filter(s=>(filter==='todos'||status(s)===filter)&&(`${clientName(s)} ${s.number}`.toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)||b.number-a.number);return `<div class="banner-help">As notas deste painel são <b>comprovantes comerciais</b>, não notas fiscais. Os registros ficam separados dos dados da Granja São José.</div><div class="toolbar"><input type="search" id="salesSearch" placeholder="Buscar por cliente ou número..." value="${E(search)}"/><select id="statusFilter"><option value="todos" ${filter==='todos'?'selected':''}>Todos os pagamentos</option><option value="due" ${filter==='due'?'selected':''}>Pendente</option><option value="partial" ${filter==='partial'?'selected':''}>Parcial</option><option value="paid" ${filter==='paid'?'selected':''}>Pago</option></select>${button('＋ Nova nota','newSale','btn primary')}</div><div class="panel"><div class="panel-head"><h3>Notas registradas (${rows.length})</h3><span class="smallprint">Total filtrado: ${fmt(sumAll(rows))}</span></div>${saleTable(rows)}</div>`}
function clientsPage(){let rows=db.clients.filter(c=>`${c.name} ${c.phone||''} ${c.address||''}`.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));return `<div class="toolbar"><input type="search" id="clientsSearch" placeholder="Buscar nome, telefone ou endereço..." value="${E(search)}"/>${button('＋ Cadastrar cliente','newClient','btn primary')}</div><div class="panel"><div class="panel-head"><h3>Clientes (${rows.length})</h3></div>${!rows.length?'<div class="empty">Nenhum cliente cadastrado.<br>Adicione o primeiro cliente para começar.</div>':`<div class="table-wrap"><table class="table"><thead><tr><th>Nome</th><th>Contato</th><th>Compras</th><th class="right">Ações</th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${E(c.name)}</b><div class="sub">${E(c.address||'Sem endereço')}</div></td><td>${E(c.phone||'—')}</td><td>${clientPurchase(c.id).length} notas</td><td><div class="actions">${button('Editar',`editClient:${c.id}`)}${button('Excluir',`deleteClient:${c.id}`,'btn danger small')}</div></td></tr>`).join('')}</tbody></table></div>`}</div>`}
function receivablesPage(){const rows=db.sales.filter(s=>due(s)>.005).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="kpi"><div class="label">Total a receber</div><strong>${fmt(rows.reduce((a,s)=>a+due(s),0))}</strong></div><div class="kpi"><div class="label">Vendas com saldo pendente</div><strong>${rows.length}</strong></div></div><div class="panel"><div class="panel-head"><h3>Valores pendentes</h3></div>${!rows.length?'<div class="empty">Tudo em dia! Não há saldos pendentes.</div>':`<div class="table-wrap"><table class="table"><thead><tr><th>Nota</th><th>Cliente</th><th>Valor da nota</th><th>Recebido</th><th>Saldo</th><th>Ação</th></tr></thead><tbody>${rows.map(s=>`<tr><td>#${numberSale(s)}<div class="sub">${dateFmt(s.date)}</div></td><td>${E(clientName(s))}</td><td>${fmt(total(s))}</td><td>${fmt(paid(s))}</td><td><b>${fmt(due(s))}</b></td><td>${button('Registrar pagamento',`pay:${s.id}`)}</td></tr>`).join('')}</tbody></table></div>`}</div>`}
function pricesPage(){
 const grp=[['Ovos brancos',TYPES.slice(0,4)],['Ovos vermelhos',TYPES.slice(4,7)],['Ovos caipiras',['Caipira']]];
 const side=(type,unit)=>{
   const key=type+'|'+unit, v=db.prices[key];
   return `<div class="price-line"><span>${E(type.replace(/ (Branco|Vermelho)$/,''))}</span><b>${v===null||v===undefined||v===''?'Consultar':fmt(v)}</b></div>`;
 };
 const card=grp.map(([name,types])=>`<div class="price-card"><div class="price-card-head">${E(name)}</div><div class="price-cols"><section><div class="price-col-title">Caixas <small>30 dúzias · 360 ovos</small></div>${types.map(t=>side(t,UNITS[1])).join('')}</section><section><div class="price-col-title">Pentes <small>30 ovos · até 3 unidades</small></div>${types.filter(t=>PENTE_PUBLICO.includes(t)).map(t=>side(t,UNITS[0])).join('')||'<p class="helper">Valores sob consulta</p>'}</section></div></div>`).join('');
 return `<div class="banner-help"><b>Seu catálogo comercial.</b> Os valores que você salvar aqui ficam disponíveis ao criar as notas e são usados na imagem da tabela de preços. Pentes: os valores divulgados são válidos até 3 unidades; para quantidades maiores, confirme o preço antes de emitir a nota.</div>
 <div class="price-layout"><div class="panel" style="margin-top:0"><div class="panel-head"><h3>Editar seus preços</h3><span class="chip">8 tipos de ovos</span></div><div class="panel-body"><form id="priceForm"><div class="table-wrap"><table class="table price-edit-table"><thead><tr><th>Produto</th><th>Caixa<br><small>30 dúzias</small></th><th>Pente<br><small>30 ovos</small></th></tr></thead><tbody>${TYPES.map((p,i)=>`<tr><td><b>${E(p)}</b></td>${[1,0].map(j=>{const u=UNITS[j],allowed=j===1||PENTE_PUBLICO.includes(p),v=db.prices[p+'|'+u];return `<td>${allowed?`<input aria-label="Preço ${E(p)} ${E(u)}" type="number" inputmode="decimal" step="0.01" min="0" name="price_${i}_${j}" value="${Number.isFinite(Number(v)) && v!==null && v!==''?v:''}" placeholder="Consultar" />`:'<small class="muted">Sob consulta</small>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>
 <label class="form-field" style="margin-top:17px">Mensagem no rodapé da tabela<input name="priceNote" maxlength="130" value="${E(db.priceNote||defaultPriceInfo)}"/></label><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary" type="submit">Salvar valores</button></div></form></div></div>
 <div class="panel" style="margin-top:0"><div class="panel-head"><h3>Prévia da tabela para clientes</h3></div><div class="panel-body"><div class="price-poster"><div class="price-poster-top"><span>COMERCIAL | VENDAS DE OVOS</span><h3>TABELA DE VALORES</h3><p>Caixas e pentes • preços por classificação</p></div><div class="price-poster-content">${card}<p class="price-disclaimer">${E(db.priceNote||defaultPriceInfo)}</p></div><div class="price-poster-foot">Qualidade, confiança e compromisso em cada entrega.</div></div>
 <div class="price-actions"><button type="button" class="btn primary" data-action="sharePrice">↗ Enviar imagem</button><button type="button" class="btn" data-action="pngPrice">↓ Baixar imagem</button><button type="button" class="btn" data-action="printPrice">Imprimir / PDF</button></div><p class="helper">No celular, “Enviar imagem” abre o compartilhamento para escolher o WhatsApp. Se não for compatível, a imagem será baixada para anexar à conversa.</p></div></div></div>`;
}
function dataPage(){return `<div class="grid2"><div class="panel"><div class="panel-head"><h3>Segurança e backup</h3></div><div class="panel-body"><div class="banner-help"><b>Atenção:</b> os dados desta versão ficam salvos somente neste navegador. Eles não aparecem automaticamente em outro celular, tablet ou computador e podem ser perdidos se você limpar os dados do site. Faça um backup com frequência.</div><p class="helper">O backup guarda clientes, notas, pagamentos e preços, permitindo recuperar seus registros depois.</p><div style="display:grid;gap:10px">${button('↓ Baixar backup completo (.json)','backupDownload','btn primary')}${button('↑ Restaurar backup (.json)','backupUpload','btn')}${button('↓ Exportar vendas em CSV','csvSales','btn')}${button('↓ Exportar clientes em CSV','csvClients','btn')}</div><input type="file" accept="application/json,.json" id="backupFile" class="hidden"/></div></div><div class="panel"><div class="panel-head"><h3>Sobre o sistema</h3></div><div class="panel-body"><p class="helper"><b>Comercial | Vendas de Ovos · Versão 2.0</b><br>Cadastros neste painel não alteram a V11 nem utilizam seu banco de dados.</p><p class="helper">Para usar a mesma base em vários dispositivos simultaneamente, será necessário configurar uma conexão online independente, com autenticação e banco de dados próprios.</p><p class="helper">As notas emitidas são comprovantes comerciais. Documentação fiscal deve ser emitida pelo meio legal aplicável.</p></div></div></div>`}
function showModal(title,body,opts={}){q('modalLayer').innerHTML=`<div class="modal ${opts.small?'sm':''}"><div class="modal-head"><h3>${E(title)}</h3><button type="button" class="icon-btn" data-action="close" aria-label="Fechar">×</button></div><div class="modal-inner">${body}</div>${opts.foot?`<div class="modal-foot">${opts.foot}</div>`:''}</div>`;q('modalLayer').classList.add('show')}
function closeModal(){q('modalLayer').classList.remove('show');q('modalLayer').innerHTML=''}
function showClient(id){const c=db.clients.find(x=>x.id===id)||{id:'',name:'',phone:'',address:'',notes:''};showModal(c.id?'Editar cliente':'Novo cliente',`<form id="clientForm" data-id="${E(c.id)}"><div class="form-grid"><label class="form-field wide">Nome do cliente *<input name="name" required value="${E(c.name)}" placeholder="Nome / estabelecimento"/></label><label class="form-field">WhatsApp / telefone<input name="phone" value="${E(c.phone||'')}" placeholder="(37) 99999-9999"/></label><label class="form-field">Endereço de entrega<input name="address" value="${E(c.address||'')}" placeholder="Rua, número, bairro"/></label><label class="form-field wide">Observações<textarea name="notes" placeholder="Anotações internas">${E(c.notes||'')}</textarea></label></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button type="button" class="btn" data-action="close">Cancelar</button><button class="btn primary" type="submit">Salvar cliente</button></div></form>`,{small:true})}
function getItemsHTML(items){return items.map(i=>itemRow(i)).join('')}
function itemRow(i={id:uid(),product:TYPES[0],unit:UNITS[0],qty:1,price:0}){const key=i.product+'|'+i.unit;return `<tr class="item-row" data-id="${E(i.id)}"><td><select class="item-prod" aria-label="Produto">${TYPES.map(t=>`<option ${t===i.product?'selected':''} value="${E(t)}">${E(t)}</option>`).join('')}</select></td><td><select class="item-unit" aria-label="Unidade">${UNITS.map(t=>`<option ${t===i.unit?'selected':''} value="${E(t)}">${E(t.startsWith('Pente')?'Pente':'Caixa')}</option>`).join('')}</select></td><td style="width:72px"><input class="item-qty" aria-label="Quantidade" type="number" min="0.01" step="0.01" value="${E(i.qty)}"/></td><td style="width:110px"><input class="item-price" aria-label="Valor unitário" type="number" min="0" step="0.01" value="${Number(i.price)||0}"/></td><td class="right row-total">${fmt(i.qty*i.price)}</td><td><button class="btn danger small item-remove" type="button" title="Excluir item">×</button></td></tr>`}
function showSale(id){const found=db.sales.find(s=>s.id===id);const s=found?structuredClone(found):{id:'',date:today(),customerId:'',manualCustomer:'',channel:'Varejo',address:'',notes:'',payments:[],items:[{id:uid(),product:TYPES[0],unit:UNITS[0],qty:1,price:db.prices[TYPES[0]+'|'+UNITS[0]]||0}]};showModal(found?`Editar nota nº ${numberSale(s)}`:'Nova nota de venda',`<form id="saleForm" data-id="${E(s.id)}"><div class="form-grid"><label class="form-field">Data da venda<input name="date" type="date" required value="${E(s.date)}"/></label><label class="form-field">Tipo de venda<select name="channel"><option ${s.channel==='Varejo'?'selected':''}>Varejo</option><option ${s.channel==='Atacado'?'selected':''}>Atacado</option></select></label><label class="form-field wide">Cliente cadastrado<select name="customerId" id="saleCustomer"><option value="">Cliente avulso / preencher abaixo</option>${db.clients.map(c=>`<option value="${E(c.id)}" ${c.id===s.customerId?'selected':''}>${E(c.name)}</option>`).join('')}</select></label><label class="form-field">Nome (se avulso)<input name="manualCustomer" value="${E(s.manualCustomer||'')}" placeholder="Nome no comprovante"/></label><label class="form-field">Entrega / referência<input name="address" value="${E(s.address||'')}" placeholder="Opcional"/></label></div>
<div class="section-title">Itens vendidos</div><div class="table-wrap"><table class="items-table"><thead><tr><th>Classificação</th><th>Unid.</th><th>Qtd.</th><th>R$ Unit.</th><th>Total</th><th></th></tr></thead><tbody id="saleItems">${getItemsHTML(s.items)}</tbody></table></div><div style="margin-top:12px;display:flex;justify-content:flex-start">${button('＋ Adicionar produto','addItem','btn small')}</div><div class="moneyline"><span>VALOR TOTAL</span><strong id="saleTotal">${fmt(total(s))}</strong></div>
${s.id?`<div class="banner-help" style="margin-top:15px">Recebido até agora: ${fmt(paid(s))}. Para lançar outro pagamento, salve e use o botão “Receber”.</div>`:`<div class="section-title">Pagamento inicial (opcional)</div><div class="form-grid"><label class="form-field">Forma<select name="payMethod">${methods.map(m=>`<option>${m}</option>`).join('')}</select></label><label class="form-field">Valor recebido na venda<input name="payAmount" type="number" min="0" step="0.01" value="0"/></label></div>`}
<label class="form-field" style="margin-top:15px">Observações<textarea name="notes" placeholder="Anotações sobre entrega ou pagamento">${E(s.notes||'')}</textarea></label><div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px"><button type="button" class="btn" data-action="close">Cancelar</button><button type="submit" class="btn primary">${s.id?'Salvar alterações':'Criar nota'}</button></div></form>`);updateItemSum();}
function readRows(){return [...document.querySelectorAll('#saleItems .item-row')].map(tr=>({id:tr.dataset.id,product:tr.querySelector('.item-prod').value,unit:tr.querySelector('.item-unit').value,qty:Number(tr.querySelector('.item-qty').value),price:Number(tr.querySelector('.item-price').value)}))}
function updateItemSum(){const rows=readRows();document.querySelectorAll('#saleItems .item-row').forEach((tr,i)=>tr.querySelector('.row-total').textContent=fmt(rows[i].qty*rows[i].price));const el=q('saleTotal');if(el)el.textContent=fmt(rows.reduce((a,i)=>a+i.qty*i.price,0))}
function showPayment(id){const s=db.sales.find(x=>x.id===id);if(!s)return;showModal('Registrar recebimento',`<div class="banner-help"><b>Nota #${numberSale(s)} — ${E(clientName(s))}</b><br>Total: ${fmt(total(s))} · Já recebido: ${fmt(paid(s))}<br><b>Falta receber: ${fmt(due(s))}</b></div><form id="paymentForm" data-id="${E(id)}"><div class="form-grid"><label class="form-field">Data do pagamento<input name="date" type="date" value="${today()}" required/></label><label class="form-field">Forma<select name="method">${methods.map(m=>`<option>${m}</option>`).join('')}</select></label><label class="form-field wide">Valor recebido (R$)<input name="amount" type="number" min="0.01" max="${due(s)}" step="0.01" value="${due(s).toFixed(2)}" required/></label></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button type="button" class="btn" data-action="close">Cancelar</button><button type="submit" class="btn primary">Salvar recebimento</button></div></form>${s.payments?.length?`<div class="section-title">Histórico de pagamentos</div><div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Forma</th><th>Valor</th><th></th></tr></thead><tbody>${s.payments.map(p=>`<tr><td>${dateFmt(p.date)}</td><td>${E(p.method)}</td><td>${fmt(p.amount)}</td><td>${button('Excluir',`deletePayment:${s.id}:${p.id}`,'btn danger small')}</td></tr>`).join('')}</tbody></table></div>`:''}`,{small:true})}
function noteHTML(s){const sums=s.items.map(i=>`<tr><td>${E(i.product)}<div class="sub">${E(i.unit)}</div></td><td class="right">${i.qty}</td><td class="right">${fmt(i.price)}</td><td class="right">${fmt(i.price*i.qty)}</td></tr>`).join('');return `<div class="receipt" id="receipt"><div class="receipt-banner"><small>COMERCIAL · VENDAS DE OVOS</small><h2>NOTA DE VENDA</h2><span style="color:#d8e8df;font-size:12px">Comprovante comercial · Não é nota fiscal</span></div><div class="receipt-main"><div class="receipt-cols"><div><b>Nº ${numberSale(s)}</b></div><div><b>Data: ${dateFmt(s.date)}</b></div></div><p style="font-size:13px"><b>Cliente:</b> ${E(clientName(s))}</p>${s.address?`<p style="font-size:12px"><b>Entrega:</b> ${E(s.address)}</p>`:''}<table><thead><tr><th>PRODUTO</th><th class="right">QTD</th><th class="right">UNIT.</th><th class="right">TOTAL</th></tr></thead><tbody>${sums}</tbody><tfoot><tr><td colspan="3">TOTAL</td><td class="right">${fmt(total(s))}</td></tr></tfoot></table><p style="font-size:12px;line-height:1.7"><b>Recebido:</b> ${fmt(paid(s))} &nbsp; <b>Pendente:</b> ${fmt(due(s))}<br><b>Pagamento:</b> ${(s.payments||[]).map(p=>E(p.method)).join(', ')||'Pendente'}${s.notes?`<br><b>Observações:</b> ${E(s.notes)}`:''}</p></div><div class="receipt-footer">Qualidade, confiança e compromisso em cada entrega.</div></div>`}
function showNote(id){const s=db.sales.find(x=>x.id===id);if(!s)return;showModal('Nota nº '+numberSale(s),`${noteHTML(s)}<div class="smallprint" style="text-align:center;margin-top:8px">Comprovante comercial; não substitui nota fiscal.</div>`,{foot:`${button('Imprimir / PDF',`print:${s.id}`,'btn')}${button('Baixar imagem PNG',`png:${s.id}`,'btn')}${button('Enviar imagem',`share:${s.id}`,'btn primary')}`})}
function makePrint(s){const w=window.open('','_blank');if(!w){alert('O navegador bloqueou a janela de impressão. Permita pop-ups e tente novamente.');return}w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Nota ${numberSale(s)}</title><style>body{font-family:Arial,sans-serif;margin:25px;color:#173e2a}.receipt{max-width:760px;margin:auto}.receipt-banner{background:#06442f!important;color:white!important;text-align:center;padding:25px;border-bottom:5px solid #cfae69;print-color-adjust:exact;-webkit-print-color-adjust:exact}.receipt-banner h2{margin:6px 0;font-size:26px}.receipt-banner small{color:#d6bb77}.receipt-main{padding:20px}.receipt-cols{display:flex;justify-content:space-between}.receipt table{border-collapse:collapse;width:100%;margin:20px 0}.receipt th{text-align:left;background:#eff4ef!important;print-color-adjust:exact;padding:10px 5px}.receipt td{border-bottom:1px solid #d5d9d5;padding:10px 5px}.right{text-align:right}.receipt tfoot td{font-weight:bold;font-size:17px}.receipt-footer{text-align:center;background:#06442f!important;border-top:4px solid #cfae69;padding:14px;color:#fff9e8!important;font:italic 13px/1.5 Georgia,serif;print-color-adjust:exact;-webkit-print-color-adjust:exact}.sub{font-size:11px;color:#666}

function roundRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function wrap(ctx,text,maxWidth){const lines=[];let l='';for(const w of String(text).split(/\s+/)){const t=l?l+' '+w:w;if(ctx.measureText(t).width>maxWidth&&l){lines.push(l);l=w}else l=t}if(l)lines.push(l);return lines}
function canvasNote(s){const W=1080, margin=74, rowheight=70;const extra=s.items.reduce((n,i)=>n+Math.max(1,Math.ceil((i.product.length)/24)),0);const H=Math.max(1060,810+s.items.length*70+(s.address?45:0)+(s.notes?150:0));const can=document.createElement('canvas');can.width=W;can.height=H;const c=can.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,W,H);c.fillStyle='#06442f';c.fillRect(0,0,W,205);c.fillStyle='#cfae69';c.fillRect(0,205,W,8);c.textAlign='center';c.fillStyle='#e5ce92';c.font='bold 23px Arial';c.fillText('COMERCIAL  ·  VENDAS DE OVOS',W/2,61);c.fillStyle='white';c.font='bold 49px Georgia';c.fillText('NOTA DE VENDA',W/2,130);c.fillStyle='#d7e7da';c.font='21px Arial';c.fillText('Comprovante comercial · Não é nota fiscal',W/2,178);c.textAlign='left';c.fillStyle='#193f2c';c.font='bold 31px Arial';c.fillText('Nº '+numberSale(s),margin,282);c.textAlign='right';c.fillText('Data: '+dateFmt(s.date),W-margin,282);c.textAlign='left';c.font='26px Arial';let y=330;c.fillText('Cliente: '+clientName(s).slice(0,56),margin,y);if(s.address){y+=42;c.font='23px Arial';c.fillText('Entrega: '+s.address.slice(0,65),margin,y)}y+=45;roundRect(c,margin,y,W-2*margin,50,8,'#eef4ed');const xs=[margin+15,margin+550,margin+680,margin+805];['PRODUTO','QTD.','UNIT.','TOTAL'].forEach((t,i)=>{c.fillStyle='#28523d';c.font='bold 22px Arial';c.textAlign=i===0?'left':'right';c.fillText(t,i===0?xs[i]:i===1?xs[1]+75:i===2?xs[2]+97:W-margin-13,y+33)});c.textAlign='left';y+=58;for(const item of s.items){c.fillStyle='#193e29';c.font='bold 24px Arial';c.fillText(item.product,margin+14,y+31);c.fillStyle='#637a69';c.font='20px Arial';c.fillText(item.unit,margin+14,y+58);c.fillStyle='#193e29';c.font='24px Arial';c.textAlign='right';c.fillText(String(item.qty),xs[1]+75,y+35);c.fillText(fmt(item.price),xs[2]+97,y+35);c.fillText(fmt(item.qty*item.price),W-margin-13,y+35);c.textAlign='left';c.strokeStyle='#e4eae3';c.beginPath();c.moveTo(margin,y+66);c.lineTo(W-margin,y+66);c.stroke();y+=rowheight}
y+=20;c.fillStyle='#eef4ed';roundRect(c,margin,y,W-2*margin,76,8,'#eef4ed');c.fillStyle='#173f2b';c.textAlign='left';c.font='bold 34px Arial';c.fillText('VALOR TOTAL',margin+23,y+50);c.textAlign='right';c.fillText(fmt(total(s)),W-margin-23,y+50);y+=126;c.textAlign='left';c.font='25px Arial';c.fillText('Recebido: '+fmt(paid(s)),margin,y);c.fillText('Pendente: '+fmt(due(s)),margin+500,y);y+=48;c.font='22px Arial';c.fillText('Pagamento: '+((s.payments||[]).map(x=>x.method).join(', ')||'Pendente'),margin,y);if(s.notes){y+=38;c.font='22px Arial';wrap(c,'Observações: '+s.notes,900).slice(0,3).forEach(l=>{c.fillText(l,margin,y);y+=30})}c.fillStyle='#06442f';c.fillRect(0,H-116,W,116);c.fillStyle='#cfae69';c.fillRect(0,H-116,W,6);c.textAlign='center';c.fillStyle='#fff9e8';c.font='italic 26px Georgia';c.fillText('Qualidade, confiança e compromisso em cada entrega.',W/2,H-52);return can}
function downloadBlob(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}

async function noteShare(s){const file=await new Promise(resolve=>canvasNote(s).toBlob(b=>resolve(new File([b],'nota-de-venda-'+numberSale(s)+'.png',{type:'image/png'})),'image/png'));try{if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'Nota de venda #'+numberSale(s)});return}}catch(e){if(e.name==='AbortError')return}notePNG(s);toast('Imagem baixada. Anexe-a no WhatsApp do cliente.')}
function saveSale(f){const form=new FormData(f);const id=f.dataset.id;const items=readRows();if(!items.length){alert('Adicione pelo menos um produto.');return}if(items.some(i=>!Number.isFinite(i.qty)||i.qty<=0||!Number.isFinite(i.price)||i.price<0)){alert('Verifique quantidades e preços dos produtos.');return}const value=norm(items.reduce((a,i)=>a+i.qty*i.price,0));if(value<=0&&!confirm('O total desta nota está zerado. Deseja salvá-la assim mesmo?'))return;
if(items.some(i=>i.unit.startsWith('Pente')&&Number(i.qty)>3)&&!confirm('A tabela de preços dos pentes vale até 3 unidades. Para este pedido com mais de 3 pentes, você confirmou o preço unitário informado?'))return;let old=db.sales.find(s=>s.id===id);let payments=old?.payments||[];if(old&&paid(old)>value+.005){alert('O novo valor da nota não pode ser menor que os pagamentos já registrados.');return}if(!old){const pm=Number(form.get('payAmount')||0);if(!Number.isFinite(pm)||pm<0||pm>value+.005){alert('O pagamento inicial não pode ultrapassar o valor da venda.');return}if(pm>0)payments=[{id:uid(),date:String(form.get('date')),method:String(form.get('payMethod')),amount:norm(pm)}]}
const data={id:old?.id||uid(),number:old?.number||db.seq++,date:String(form.get('date')),channel:String(form.get('channel')),customerId:String(form.get('customerId')),manualCustomer:String(form.get('manualCustomer')||''),address:String(form.get('address')||''),notes:String(form.get('notes')||''),items,payments};if(old)db.sales[db.sales.findIndex(s=>s.id===id)]=data;else db.sales.push(data);save();closeModal();page='vendas';render();toast('Nota salva com sucesso.');showNote(data.id)}

function priceVal(type,unit){const p=db.prices[type+'|'+unit];return p===null||p===undefined||p===''||!Number.isFinite(Number(p))?'CONSULTAR':fmt(p)}

async function canvasBlob(c){return await new Promise(resolve=>c.toBlob(resolve,'image/png'))}
function pricePNG(){pricePosterCanvas().toBlob(b=>{if(b){downloadBlob(b,'tabela-de-valores-ovos-'+today()+'.png');toast('Tabela em imagem salva.')}})}
async function priceShare(){const blob=await canvasBlob(pricePosterCanvas());if(!blob){alert('Não foi possível gerar a imagem.');return}const file=new File([blob],'tabela-de-valores-ovos.png',{type:'image/png'});try{if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'Tabela de valores — Ovos'});return}}catch(e){if(e.name==='AbortError')return}downloadBlob(blob,file.name);toast('Imagem baixada. Anexe-a no WhatsApp do cliente.')}
function printPrice(){const img=pricePosterCanvas().toDataURL('image/png'),stage=document.createElement('div');stage.id='printStage';stage.innerHTML=`<img src="${img}" alt="Tabela de valores" style="max-width:100%;display:block;margin:auto;max-height:96vh"/>`;document.body.appendChild(stage);window.print();setTimeout(()=>stage.remove(),900)}
function doAction(action){const [a,id,id2]=action.split(':');switch(a){case'newSale':showSale();break;case'newClient':showClient();break;case'close':closeModal();break;case'gotoSales':page='vendas';search='';render();break;case'gotoReceivables':page='receber';render();break;case'gotoPrices':page='precos';render();break;case'pngPrice':pricePNG();break;case'sharePrice':priceShare();break;case'printPrice':printPrice();break;case'addItem':{q('saleItems').insertAdjacentHTML('beforeend',itemRow({id:uid(),product:TYPES[0],unit:UNITS[0],qty:1,price:db.prices[TYPES[0]+'|'+UNITS[0]]||0}));updateItemSum();break}case'editClient':showClient(id);break;case'deleteClient':{const c=db.clients.find(x=>x.id===id);if(!c)return;const n=clientPurchase(id).length;if(n){alert('Este cliente possui '+n+' notas vinculadas. Preserve o cadastro para manter o histórico.');return}if(confirm('Excluir cliente '+c.name+'?')){db.clients=db.clients.filter(x=>x.id!==id);save();render()}break}case'editSale':showSale(id);break;case'deleteSale':{const sale=db.sales.find(s=>s.id===id);if(sale&&confirm('Excluir DEFINITIVAMENTE a nota nº '+numberSale(sale)+' de '+clientName(sale)+'? Isso também apagará os pagamentos registrados nela. Faça backup antes de excluir se precisar do histórico.')){db.sales=db.sales.filter(s=>s.id!==id);save();render();toast('Nota excluída.')}break}case'note':showNote(id);break;case'pay':showPayment(id);break;case'print':{const s=db.sales.find(x=>x.id===id);if(s)makePrint(s);break}case'png':{const s=db.sales.find(x=>x.id===id);if(s)notePNG(s);break}case'share':{const s=db.sales.find(x=>x.id===id);if(s)noteShare(s);break}case'deletePayment':{const s=db.sales.find(x=>x.id===id);if(s&&confirm('Excluir este recebimento? O valor voltará a ficar pendente.')){s.payments=s.payments.filter(x=>x.id!==id2);save();showPayment(id);render()}break}case'backupDownload':downloadBlob(new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),'backup-comercial-ovos-'+today()+'.json');toast('Backup gerado. Guarde este arquivo.');break;case'backupUpload':q('backupFile').click();break;case'csvSales':exportSales();break;case'csvClients':exportClients();break;}}
function csvCell(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}
function exportCSV(rows,name){const body='\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');downloadBlob(new Blob([body],{type:'text/csv;charset=utf-8'}),name)}
function exportSales(){exportCSV([['Número','Data','Cliente','Canal','Total','Recebido','Pendente','Status'],...db.sales.map(s=>[s.number,s.date,clientName(s),s.channel,total(s).toFixed(2),paid(s).toFixed(2),due(s).toFixed(2),status(s)])],'vendas-ovos-'+today()+'.csv')}
function exportClients(){exportCSV([['Nome','Telefone','Endereço','Observações'],...db.clients.map(c=>[c.name,c.phone,c.address,c.notes])],'clientes-ovos-'+today()+'.csv')}
q('quickNew').addEventListener('click',()=>showSale());document.addEventListener('click',ev=>{const tab=ev.target.closest('[data-page]');if(tab){page=tab.dataset.page;search='';filter='todos';render();return}const act=ev.target.closest('[data-action]');if(act){doAction(act.dataset.action);return}if(ev.target.matches('.item-remove')){const row=ev.target.closest('.item-row');if(document.querySelectorAll('.item-row').length>1){row.remove();updateItemSum()}else toast('Mantenha pelo menos um item.')}});
document.addEventListener('change',e=>{if(e.target.id==='periodChoice'){period=e.target.value;render()}else if(e.target.id==='statusFilter'){filter=e.target.value;render()}else if(e.target.closest('.item-row')&&(e.target.classList.contains('item-unit')||e.target.classList.contains('item-prod'))){const tr=e.target.closest('.item-row');tr.querySelector('.item-price').value=db.prices[tr.querySelector('.item-prod').value+'|'+tr.querySelector('.item-unit').value]||0;updateItemSum()}else if(e.target.id==='backupFile'&&e.target.files?.[0]){const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if(!v||!Array.isArray(v.clients)||!Array.isArray(v.sales)||typeof v.seq!=='number')throw Error('Estrutura inválida');if(!confirm('Restaurar backup? Isso SUBSTITUIRÁ todos os clientes, notas e pagamentos deste dispositivo.'))return;db={...base(),...v};save();render();toast('Backup restaurado.')}catch(err){alert('Não foi possível restaurar este arquivo de backup.')}};reader.readAsText(e.target.files[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.closest('#saleItems')&&(e.target.matches('.item-qty')||e.target.matches('.item-price'))){updateItemSum()}else if(e.target.id==='salesSearch'||e.target.id==='clientsSearch'){const el=e.target,caret=el.selectionStart;search=el.value;const currentPage=page;render();const replacement=q(el.id);if(replacement&&currentPage===page){replacement.focus();replacement.setSelectionRange(caret,caret)}}});
document.addEventListener('submit',e=>{if(e.target.id==='clientForm'){e.preventDefault();const f=e.target,v=new FormData(f),id=f.dataset.id;const name=String(v.get('name')).trim();if(!name){alert('Informe o nome do cliente.');return}const c={id:id||uid(),name,phone:String(v.get('phone')||'').trim(),address:String(v.get('address')||'').trim(),notes:String(v.get('notes')||'').trim()};if(id){db.clients[db.clients.findIndex(x=>x.id===id)]=c}else db.clients.push(c);save();closeModal();page='clientes';render();toast('Cliente salvo.')}else if(e.target.id==='saleForm'){e.preventDefault();saveSale(e.target)}else if(e.target.id==='paymentForm'){e.preventDefault();const f=e.target,v=new FormData(f),s=db.sales.find(x=>x.id===f.dataset.id),amt=norm(Number(v.get('amount')));if(!s||!Number.isFinite(amt)||amt<=0||amt>due(s)+.005){alert('Confira o valor do pagamento.');return}s.payments.push({id:uid(),date:String(v.get('date')),method:String(v.get('method')),amount:amt});save();closeModal();render();toast('Pagamento registrado.')}else if(e.target.id==='priceForm'){e.preventDefault();const v=new FormData(e.target);TYPES.forEach((p,i)=>UNITS.forEach((u,j)=>{if(j===0&&!PENTE_PUBLICO.includes(p)){db.prices[p+'|'+u]=null;return}const str=String(v.get(`price_${i}_${j}`)??'').trim();db.prices[p+'|'+u]=str===''?null:norm(Math.max(0,Number(str)))}));db.priceNote=String(v.get('priceNote')||defaultPriceInfo).slice(0,130);save();render();toast('Tabela atualizada. Agora você pode compartilhar a imagem.')}});
